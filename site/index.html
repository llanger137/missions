<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions feed</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --card: #151922; --fg: #e8eaf0; --dim: #8a90a0; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #meta { color: var(--dim); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 0 16px 16px; }
  a.card { background: var(--card); border-radius: 8px; overflow: hidden; color: inherit; text-decoration: none; }
  a.card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .txt { padding: 8px 10px 10px; }
  .m { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header><h1>Missions feed</h1><div id="meta">loading…</div></header>
<main id="grid"></main>
<script>
fetch("manifest.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  document.getElementById("meta").textContent =
    `${d.items.length} images · updated ${d.updated}` +
    (d.failed_sources.length ? ` · failed: ${d.failed_sources.join(", ")}` : "");
  const grid = document.getElementById("grid");
  for (const it of d.items) {
    const a = document.createElement("a");
    a.className = "card"; a.href = it.page; a.target = "_blank"; a.rel = "noopener";
    const img = document.createElement("img");
    img.loading = "lazy"; img.src = it.thumb; img.alt = it.title;
    const t = document.createElement("div"); t.className = "txt";
    const m = document.createElement("div"); m.className = "m";
    m.textContent = `${it.mission} · ${it.date.slice(0, 10)} · ${it.source}` +
      (it.taken ? ` · taken ${it.taken}` : "");
    const h = document.createElement("div"); h.textContent = it.title;
    t.append(m, h); a.append(img, t); grid.append(a);
  }
}).catch(e => { document.getElementById("meta").textContent = "failed to load manifest: " + e; });
</script>
</body>
</html>
